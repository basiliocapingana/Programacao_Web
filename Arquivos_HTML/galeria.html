<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <link rel="stylesheet" href="../Arquivos_CSS/galeria.css">
</head>
<body>
    <div class="galeria">
  <!-- Inputs de rádio (ficam escondidos) -->
  <input type="radio" name="fotos" id="radio1" checked>
  <input type="radio" name="fotos" id="radio2">
  <input type="radio" name="fotos" id="radio3">

  <!-- Área onde as imagens aparecem -->
  <div class="imagens-container">
    <div class="imagem img1"><img src="../img/uwp4988362.jpeg" alt="Foto 1"></div>
    <div class="imagem img2"><img src="../img/wp13507777-chevrolet-wallpapers.png" alt="Foto 2"></div>
    <div class="imagem img3"><img src="../img/wp3978503-bmw-wallpapers.jpg" alt="Foto 3"></div>
  </div>

  <!-- Rótulos (labels) que funcionam como botões para clicar -->
  <div class="botoes">
    <label for="radio1">Foto 1</label>
    <label for="radio2">Foto 2</label>
    <label for="radio3">Foto 3</label>
  </div>
</div>
</body>
</html>
