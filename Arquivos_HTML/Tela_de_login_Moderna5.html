<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login|App</title>
    <link rel="stylesheet" href="../Arquivos_CSS/Tela_de_login_Moderna5.css">
</head>
<body>
    <main class="container">
        <h1>Login</h1>
        <form action="#" method="post" class="form-login">
            <section class="form-input">
                <input type="text" required autocomplete="name" id="nome-de-sario">
                <label for="nome-de-sario">Usuário</label>
            </section>

            <section class="form-input">
                <input type="password" required autocomplete="current-password" id="senha-de-sario">
                <label for="senha-de-sario">Senha</label>
            </section>

            <section class="mostrar-e-lembrar-senha">
                <label for="mostrar-e-lembrar-senha">
                    <input type="checkbox" id="mostrar-e-lembrar-senha">
                    Mostrar senha
                </label>

                <a href="#">Recuperar senha</a>
            </section>

            <section class="botao-login">
                <input type="submit" value="Login">
            </section>

            <section class="criar-conta">
                <p>Não tem conta? <a href="#">Criar conta</a></p>
            </section>
        </form>
    </main>
</body>
</html>
