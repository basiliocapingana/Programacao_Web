<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login</title>
    <link rel="stylesheet" href="../Arquivos_CSS/Tela_de_Login_Moderna2.css">
</head>
<body>
    <main class="container">
        <h1>Login</h1>
        <form action="#" class="form-login">
            <section class="input-form">
                <input type="text" required autocomplete="name" id="nome-de-usuario" placeholder="Seu nome">
            </section>

            <section class="input-form">
                <input type="password" required autocomplete="current-password" id="senha-do-usuario" placeholder="Senha">
            </section>

            <section class="mostrar-lembrar-senha">
                <label for="mostra-senha">
                    <input type="checkbox" id="mostra-senha">
                    Mostrar senha
                </label>

                <a href="#">Esqueci a senha</a>
            </section>

            <section class="botao-login">
                <button type="submit">Login</button>
            </section>

            <section class="criar-conta">
                <p>Não tem conta ? <a href="#">Criar conta</a></p>
            </section>
        </form>
    </main>
</body>
</html>
