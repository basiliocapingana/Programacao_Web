<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login|Moderna</title>
    <link rel="stylesheet" href="../Arquivos_CSS/Tela_de_login_Moderna1.css">
</head>
<body>
    <main class="container">
        <div class="form-login">
            <form action="#">
                <h1>Login</h1>

                <div class="form-group">
                    <input id="username" type="text" required autocomplete="name">
                    <label for="username">Username</label>
                </div>

                <div class="form-group">
                    <input id="password_user" type="password" required autocomplete="name">
                    <label for="password_user">Password</label>
                </div>

                <div class="mostrar_e_lembrar_senha">
                    <label for="mostrar_senha">
                        <input id="mostrar_senha" type="checkbox">
                        Mostrar senha
                    </label>

                    <a href="#">Esqueci a senha</a>
                </div>

                <div class="botao-login">
                    <button>Login</button>
                </div>

                <div class="criar_conta">
                    <p>Não tem conta <a href="#">Criar conta</a></p>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
